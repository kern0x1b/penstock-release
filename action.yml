name: Penstock
description: Check, lint, lay out and deploy BPMN diagrams with the configuration the project already has.
author: kern0x1b

branding:
  icon: git-branch
  color: blue

inputs:
  command:
    description: Which penstock command to run — check, lint, layout, fmt, deploy, doctor.
    required: false
    default: check
  paths:
    description: What to run it on. Defaults to the whole checkout.
    required: false
    default: .
  profile:
    description: The profile to use, as PENSTOCK_PROFILE would.
    required: false
    default: ''
  version:
    description: The version of Penstock to run. By default the project's penstockw runs the version it pins.
    required: false
    default: ''
  baseline:
    description: For check — fail only on findings the baseline does not already accept.
    required: false
    default: 'false'
  sarif:
    description: For check — write SARIF to the path given, for upload to code scanning.
    required: false
    default: ''
  args:
    description: Anything else to pass through, such as --write or --dry-run.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Keep downloaded Penstock versions between runs
      if: inputs.version == '' && hashFiles('penstock/wrapper/penstock-wrapper.properties') != ''
      uses: actions/cache@v4
      with:
        path: ~/.penstock/wrapper/dists
        key: penstock-${{ runner.os }}-${{ hashFiles('penstock/wrapper/penstock-wrapper.properties') }}

    - name: Choose how to run Penstock
      id: pinned
      shell: bash
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          echo "run=npx --yes @penstock/cli@${{ inputs.version }}" >> "$GITHUB_OUTPUT"
        elif [ -f penstockw ]; then
          echo "run=sh ./penstockw" >> "$GITHUB_OUTPUT"
        else
          echo "run=npx --yes @penstock/cli@latest" >> "$GITHUB_OUTPUT"
        fi

    - name: Run penstock
      shell: bash
      env:
        PENSTOCK_PROFILE: ${{ inputs.profile }}
      run: |
        set -o pipefail
        extra="${{ inputs.args }}"
        [ "${{ inputs.baseline }}" = "true" ] && extra="$extra --baseline"

        if [ -n "${{ inputs.sarif }}" ]; then
          ${{ steps.pinned.outputs.run }} ${{ inputs.command }} ${{ inputs.paths }} \
            --format sarif $extra > "${{ inputs.sarif }}"
        else
          ${{ steps.pinned.outputs.run }} ${{ inputs.command }} ${{ inputs.paths }} \
            --format github $extra
        fi
