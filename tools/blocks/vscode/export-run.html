<p>The <span class="ui">Export…</span> action described above asks where to save the picture. To export every diagram of a project at once, use <span class="ui">Run Penstock | Export</span> in the <a href="@vscode/where-things-are.html">Penstock view</a>. <span class="ui">Copy</span> in the Export dialog puts the picture on the clipboard as a PNG, as in the IDE.</p>
