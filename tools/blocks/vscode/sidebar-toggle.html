<p>The shortcut is <kbd>Ctrl+Alt+'</kbd>, or <kbd>Cmd+Alt+'</kbd> on a Mac, and the command is <span class="ui">Penstock: Sidebar</span>. The keys are bound only while a Penstock editor has focus. The <strong>Code</strong> view in the Explorer is a different surface. See <a href="@vscode/shortcuts.html">Shortcuts</a>.</p>
