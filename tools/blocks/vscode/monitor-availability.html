<p>Monitor is a tab of the sidebar, and the toolbar button, or <span class="ui">Penstock: Monitor</span>, opens it. It asks the engine of the profile in force. <span class="ui">Go to code</span> on an incident goes through the code links, so with Pro a job type opens its worker. See <a href="@vscode/code-links.html">Code links in VS Code</a>.</p>
