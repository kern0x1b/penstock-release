<p>The check card has a <strong>Code</strong> section. In VS Code the same findings are in the Problems view for the whole workspace, under the source <em>penstock</em>, once you have Pro. Each one has a file and a line, and a click opens it. For a pipeline, run <code>penstock code</code>. See <a href="@vscode/code-links.html">Code links in VS Code</a>.</p>
