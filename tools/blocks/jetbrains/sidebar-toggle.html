<p>The shortcut is <code>Ctrl+Alt+'</code>, or <code>&#8984;&#8997;'</code> on a Mac, and the action is called <span class="ui">Sidebar</span> in the keymap, under <span class="mono">Tools | Penstock | View</span>. The Penstock tool window is a different surface: it is on the stripe at the side of the IDE and shows the whole project as a tree. See <a href="@jetbrains/tool-window.html">The Penstock tool window</a>.</p>
