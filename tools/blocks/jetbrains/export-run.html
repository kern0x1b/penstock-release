<p>The <span class="ui">Export…</span> action described above uses the IDE's save dialog. To export every diagram of a project at once, use <span class="ui">Run Penstock | Export…</span> in the <a href="@jetbrains/tool-window.html">tool window</a>. It asks for a folder and a format, SVG or PNG. SVG needs nothing, and PNG needs <code>puppeteer</code> installed in the project.</p>
