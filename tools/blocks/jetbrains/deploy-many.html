<p>In the <a href="@jetbrains/tool-window.html">Penstock tool window</a>: right-click a file or a process and press <span class="ui">Deploy</span>. It goes to that file's profile. Right-click a profile under <em>Deployment</em> to send every diagram to it. Hooks run only in a trusted project, and the password comes from the IDE password safe.</p>
