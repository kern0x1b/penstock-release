<p>Open the <a href="@jetbrains/tool-window.html">Penstock tool window</a> and find <strong>Migrate to Camunda 8</strong>. It lists every file with its status and findings, and the Java code with what each class becomes. Right-click a file and choose <span class="ui">Convert to Camunda 8…</span>, or use <span class="ui">Convert All…</span> on the root.</p>
