<p>Press <span class="ui">Check</span> on the editor's toolbar for the diagram you have open. For a whole project, right-click a file or a folder in the <a href="@jetbrains/tool-window.html">Penstock tool window</a> and choose <span class="ui">Run Penstock | Check</span>. The report opens in the Run window. It runs only in a trusted project.</p>
