<p>In the <a href="@jetbrains/tool-window.html">Penstock tool window</a> press <span class="ui">Open penstock.yaml</span>. It opens the file, or creates it when there is none. When a project still has settings in <code>.idea/bpmn-project.xml</code> and no <code>penstock.yaml</code>, a notification offers to write one from them. Penstock has no page in <span class="ui">Settings</span>.</p>
