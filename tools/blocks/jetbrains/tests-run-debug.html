<p>Right-click an element on the canvas, or the empty canvas, and choose <span class="ui">Run Tests</span> or <span class="ui">Debug Tests</span>. In the <a href="@jetbrains/tool-window.html">Penstock tool window</a> a <strong>Tests</strong> node lists every process test by class, and <span class="ui">Run All Process Tests</span> is on its toolbar. See <a href="@jetbrains/test-runner.html">Tests in the IDE</a>.</p>
