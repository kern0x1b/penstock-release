name: Penstock bot
description: Answers in pull requests that change BPMN diagrams — problems, what changed, and a picture of it.
author: kern0x1b

branding:
  icon: message-square
  color: blue

inputs:
  token:
    description: The token the bot answers with. The workflow's own token is enough.
    required: false
    default: ${{ github.token }}
  version:
    description: The version of Penstock to run. By default the project's penstockw runs the version it pins.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Keep downloaded Penstock versions between runs
      if: inputs.version == '' && hashFiles('penstock/wrapper/penstock-wrapper.properties') != ''
      uses: actions/cache@v4
      with:
        path: ~/.penstock/wrapper/dists
        key: penstock-${{ runner.os }}-${{ hashFiles('penstock/wrapper/penstock-wrapper.properties') }}

    - name: Choose how to run Penstock
      id: pinned
      shell: bash
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          echo "run=npx --yes @penstock/cli@${{ inputs.version }}" >> "$GITHUB_OUTPUT"
        elif [ -f penstockw ]; then
          echo "run=sh ./penstockw" >> "$GITHUB_OUTPUT"
        else
          echo "run=npx --yes @penstock/cli@latest" >> "$GITHUB_OUTPUT"
        fi

    - name: Read the change
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: ${{ steps.pinned.outputs.run }} bot . --stage draw

    - name: Keep the picture with this run
      id: picture
      uses: actions/upload-artifact@v7
      with:
        path: ${{ runner.temp }}/penstock-bot/penstock-diagrams.svg
        archive: false
        overwrite: true
        if-no-files-found: ignore

    - name: Answer
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        PENSTOCK_PICTURES_URL: ${{ steps.picture.outputs.artifact-url }}
      run: ${{ steps.pinned.outputs.run }} bot . --stage post
